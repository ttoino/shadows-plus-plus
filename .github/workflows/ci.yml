name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Format
        run: find . -name '*.[ch]pp' -not -path './.git/*' -not -path './.direnv/*' -not -path './result/*' -exec clang-format -Werror -i --dry-run {} +

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup nix
        uses: cachix/install-nix-action@v31
      - name: Setup cachix
        uses: cachix/cachix-action@v16
        with:
          name: toino
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: hyprland,nix-community
      - name: Check
        run: nix flake check --all-systems --keep-going --print-build-logs
